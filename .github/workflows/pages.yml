name: Publish free GitHub Pages dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '24 6 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_pages.py'
      - 'power_pulse/**'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch real hourly data from SMARD
        run: python -m scripts.build_pages --days 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
